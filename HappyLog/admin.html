<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3d5149">
  <meta name="robots" content="noindex, nofollow">
  <title>阅读邀请 · happy 跑团</title>
  <link rel="stylesheet" href="./access.css?v=3044f33234">
  <script src="./access-config.js?v=3eb0b67e93"></script>
  <script src="./access.js?v=8e2b3b4ef7" defer></script>
</head>
<body class="admin-body" data-access="admin">
  <header class="admin-header admin-width">
    <a class="admin-brand" href="./index.html"><em>happy</em> 跑团</a>
    <a href="./index.html">返回故事集 ↗</a>
  </header>
  <main class="admin-main admin-width">
    <section class="admin-login-panel" id="admin-login-panel" aria-labelledby="admin-login-title">
      <p class="admin-eyebrow">HAPPYLOG · 管理</p>
      <h1 id="admin-login-title">阅读邀请</h1>
      <p class="admin-intro">为朋友打开故事，管理每份邀请可以阅读的篇目。</p>
      <form class="access-form" id="admin-login-form">
        <label for="admin-username-input">管理员账号</label>
        <input id="admin-username-input" name="username" autocomplete="username" maxlength="80" required>
        <label for="admin-password">密码</label>
        <input id="admin-password" name="password" type="password" autocomplete="current-password" maxlength="256" required>
        <div class="access-form-actions"><button type="submit">登录管理</button></div>
        <p class="access-status" id="admin-login-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="admin-dashboard" aria-labelledby="admin-title" hidden>
      <div class="admin-title-row">
        <div><p class="admin-eyebrow">HAPPYLOG · 管理</p><h1 id="admin-title">阅读邀请</h1></div>
        <div class="admin-session"><span id="admin-username">管理员</span><button class="access-text-button" id="admin-logout" type="button">退出登录</button></div>
      </div>
      <div class="admin-layout">
        <div>
          <section class="admin-panel" aria-labelledby="invite-form-title">
            <h2 id="invite-form-title">创建邀请码</h2>
            <p class="admin-intro">选择可以阅读的故事，再把邀请码交给朋友。</p>
            <form class="access-form" id="invite-form">
              <label for="invite-label">备注 <small>方便自己辨认</small></label>
              <input id="invite-label" name="label" maxlength="80" placeholder="例如：周末跑团的朋友">
              <div id="invite-code-field">
                <label for="custom-invite-code" class="access-choice">自定义邀请码 <small>留空自动生成</small></label>
                <input id="custom-invite-code" name="code" minlength="6" maxlength="128" autocomplete="off" spellcheck="false" placeholder="至少 6 个非空白字符">
              </div>
              <fieldset><legend>可阅读的故事</legend><div id="invite-story-options"></div></fieldset>
              <label for="invite-expiry">到期时间 <small>留空长期有效 · 当前时区</small></label>
              <input id="invite-expiry" name="expiresAt" type="datetime-local">
              <div class="access-form-actions"><button id="invite-submit" type="submit">创建邀请码</button><button id="invite-cancel" class="access-secondary" type="button" hidden>取消编辑</button></div>
              <p class="access-status" id="invite-status" role="status" aria-live="polite"></p>
            </form>
          </section>
          <section class="created-invite" id="created-invite" aria-labelledby="created-invite-title" hidden>
            <h3 id="created-invite-title">这份邀请，准备好了。</h3>
            <code id="created-invite-code"></code>
            <p>完整邀请码仅在此处显示一次，请复制并妥善保存。</p>
            <div class="access-form-actions"><button class="access-button" id="copy-invite-code" type="button">复制邀请码</button><button class="access-button" id="dismiss-invite-code" type="button">已保存，收起</button></div>
            <p class="access-status" id="copy-status" role="status" aria-live="polite"></p>
          </section>
        </div>
        <section aria-labelledby="invite-list-title">
          <div class="admin-list-heading"><h2 id="invite-list-title">已有邀请</h2><span id="invite-count"></span></div>
          <p class="access-status" id="invite-list-status" role="status" aria-live="polite"></p>
          <div class="invite-list" id="invite-list"></div>
        </section>
      </div>
      <details class="admin-password-panel">
        <summary>更改管理员密码</summary>
        <form class="access-form admin-password-form" id="admin-password-form">
          <div class="access-field"><label for="current-password">当前密码</label><input id="current-password" name="currentPassword" type="password" autocomplete="current-password" maxlength="256" required></div>
          <div class="access-field"><label for="new-password">新密码 <small>至少 10 个字符</small></label><input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="256" required></div>
          <div class="access-field"><label for="confirm-password">再次填写新密码</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="256" required></div>
          <div class="access-form-actions"><button type="submit">更改密码</button></div>
          <p class="access-status" id="password-status" role="status" aria-live="polite"></p>
        </form>
      </details>
    </section>
    <noscript><p class="access-status">请启用 JavaScript 后登录管理。</p></noscript>
  </main>
  <footer class="admin-footer admin-width">happy 跑团 · 把掷过的骰子，写成故事。</footer>
</body>
</html>
