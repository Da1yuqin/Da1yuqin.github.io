<style>
  .blog-footprints { scroll-margin-top: 90px; margin: 48px 0 24px; color: var(--day-ink, #30362e); font-size: 13px; line-height: 1.6; }
  .blog-footprints h2 { margin: 0 0 14px; padding: 0; border: 0; font-family: inherit; font-size: 14px; font-weight: 500; }
  .blog-comments__editor { border: 1px solid #dedfd8; border-radius: 3px; background: #fff; }
  .blog-comments__name { display: block; margin: 0 14px; padding: 9px 0; border-bottom: 1px dashed #e4e4df; }
  .blog-comments__form input:not([type]), .blog-comments__form textarea { display: block; box-sizing: border-box; width: 100%; margin: 0; padding: 6px 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; color: #30362e; font: inherit; }
  .blog-comments__form input:not([type]) { max-width: 260px; font-size: 13px; }
  .blog-comments__form textarea { padding: 14px; min-height: 145px; resize: vertical; font-size: 14px; line-height: 1.75; }
  .blog-comments__form input::placeholder, .blog-comments__form textarea::placeholder { color: #737b6b; opacity: 1; }
  .blog-comments__form input:focus, .blog-comments__form textarea:focus { outline: 0; box-shadow: inset 0 -1px #73826a; }
  .blog-comments__actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; padding: 10px 14px 14px; }
  .blog-comments__actions fieldset { display: flex; flex-wrap: wrap; gap: 16px; margin: 0; padding: 0; border: 0; }
  .blog-comments__actions label { display: inline-flex; align-items: center; gap: 5px; margin: 0; font-size: 12px; font-weight: normal; color: #74796f; cursor: pointer; }
  .blog-comments__actions input[type="radio"] { width: 12px; height: 12px; display: inline-block; margin: 0; accent-color: #526349; }
  .blog-footprints__button { padding: 6px 16px; margin: 0; border: 1px solid #cdd3c6; border-radius: 3px; background: #fff; color: #526349; font: inherit; font-size: 12px; cursor: pointer; }
  .blog-footprints__button:hover { background: #f1f4ed; border-color: #73826a; }
  .blog-footprints__button:disabled { opacity: .45; cursor: not-allowed; }
  .blog-footprints .blog-comments__privacy, .blog-footprints .blog-comments__status { margin: 9px 0 0; font-size: 12px; color: #737b6b; line-height: 1.6; }
  .blog-comments__status:empty { display: none; }
  .blog-footprints .blog-comments__empty { margin: 24px 0; text-align: center; font-size: 13px; color: #737b6b; }
  .blog-comments__item { padding: 18px 0; border-bottom: 1px solid #e5e7de; font-size: 13px; }
  .blog-comments__item strong { font-size: 13px; font-weight: 500; }
  .blog-comments__item p { margin: 8px 0 0; font-size: 14px; line-height: 1.75; white-space: pre-wrap; overflow-wrap: anywhere; }
  .blog-comments__item time { margin-left: 12px; color: #999c92; font-size: 11px; }
  .blog-footprints__stats { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 20px; font-size: 11px; color: #969a90; }
  .blog-footprints__stats strong { font-weight: normal; }
  .blog-footprints [hidden] { display: none !important; }
</style>

<section class="blog-footprints" id="footprints" aria-labelledby="footprints-title">
  <h2 id="footprints-title">评论区</h2>
  <form class="blog-comments__form">
    <div class="blog-comments__editor">
    <label class="blog-comments__name"><span class="sr-only">昵称（选填）</span><input name="name" maxlength="40" autocomplete="nickname" placeholder="昵称（选填，匿名也可以）" /></label>
    <label class="blog-comments__content"><span class="sr-only">你的评论</span><textarea name="content" required maxlength="2000" rows="4" placeholder="写下你的想法…"></textarea></label>
    <div class="blog-comments__actions">
      <fieldset><legend class="sr-only">评论可见范围</legend>
        <label><input type="radio" name="visibility" value="public" /> 公开评论</label>
        <label><input type="radio" name="visibility" value="private" checked /> 私密评论</label>
      </fieldset>
      <button class="blog-footprints__button" type="submit" disabled>发布评论</button>
    </div>
    </div>
    <p class="blog-comments__privacy">私密评论仅 Day 可见。</p>
    <p class="blog-comments__status" role="status" aria-live="polite"></p>
  </form>
  <div class="blog-comments__list" aria-live="polite"></div>
  <p class="blog-comments__empty" hidden>来发评论吧～</p>
  <div class="blog-footprints__stats" aria-live="polite">
    <span id="busuanzi_container_page_pv" hidden>本页阅读 <strong id="busuanzi_page_pv"></strong> 次</span>
    <span id="busuanzi_container_page_uv" hidden>本页来访 <strong id="busuanzi_page_uv"></strong> 人</span>
  </div>
</section>

<script>
  (function () {
    var localPreview = ['localhost', '127.0.0.1', '::1', '[::1]'].indexOf(location.hostname) !== -1;
    document.addEventListener('click', function (event) {
      var link = event.target.closest('a');
      if (!link || localPreview || typeof window.gtag !== 'function') return;
      if (link.closest('.az-post')) {
        window.gtag('event', 'blog_article_open', {article_path: new URL(link.href).pathname});
      }
    });
    {% if jekyll.environment == 'production' and site.blog_visit_counter %}
    if (localPreview) return;
    var count = document.getElementById('busuanzi_page_pv');
    var observer = new MutationObserver(function () {
      if (!/^\d+$/.test(count.textContent)) return;
      ['page_pv', 'page_uv'].forEach(function (metric) {
        var value = document.getElementById('busuanzi_' + metric);
        if (/^\d+$/.test(value.textContent)) document.getElementById('busuanzi_container_' + metric).hidden = false;
      });
      observer.disconnect();
    });
    observer.observe(document.querySelector('.blog-footprints__stats'), {childList: true, subtree: true});
    var counter = document.createElement('script');
    counter.src = 'https://busuanzi.9420.ltd/js';
    counter.async = true;
    document.body.appendChild(counter);
    setTimeout(function () { observer.disconnect(); }, 15000);
    {% endif %}
  }());
</script>

<script>
  (function () {
    var section = document.getElementById('footprints');
    var form = section.querySelector('form');
    var button = form.querySelector('button');
    var status = section.querySelector('.blog-comments__status');
    var privacy = section.querySelector('.blog-comments__privacy');
    var list = section.querySelector('.blog-comments__list');
    var api = {{ site.blog_comments_api | default: '' | jsonify }};
    var page = {{ page.url | jsonify }};
    form.addEventListener('change', function () {
      privacy.textContent = form.elements.visibility.value === 'private' ? '私密评论仅 Day 可见。' : '公开评论会显示在下方，所有人可见。';
    });
    if (!api) { status.textContent = '评论暂未开放。'; return; }
    button.disabled = false;
    async function request(url, options) {
      var controller = new AbortController();
      var timeout = setTimeout(function () { controller.abort(); }, 12000);
      try { return await fetch(url, Object.assign({}, options, {signal: controller.signal})); }
      finally { clearTimeout(timeout); }
    }
    function showComments(comments) {
      list.replaceChildren();
      section.querySelector('.blog-comments__empty').hidden = comments.length > 0;
      comments.forEach(function (comment) {
        var item = document.createElement('article'); item.className = 'blog-comments__item';
        var name = document.createElement('strong'); name.textContent = comment.name || '匿名';
        var time = document.createElement('time'); time.dateTime = comment.created_at;
        time.textContent = new Date(comment.created_at).toLocaleDateString('zh-CN');
        var content = document.createElement('p'); content.textContent = comment.content;
        item.append(name, time, content); list.append(item);
      });
    }
    async function loadComments() {
      var response = await request(api.replace(/\/$/, '') + '/comments?page=' + encodeURIComponent(page));
      if (!response.ok) throw new Error('load');
      var data = await response.json(); showComments(data.comments);
    }
    loadComments().catch(function () { if (!status.textContent) status.textContent = '公开评论暂时加载失败，请稍后刷新。'; });
    form.addEventListener('submit', async function (event) {
      event.preventDefault(); if (button.disabled || !form.reportValidity()) return;
      button.disabled = true; status.textContent = '正在发布…';
      var visibility = form.elements.visibility.value;
      try {
        var response = await request(api.replace(/\/$/, '') + '/comments', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({page: page, name: form.elements.name.value, content: form.elements.content.value, visibility: visibility})
        });
        var result = await response.json();
        if (!response.ok) throw new Error(result.error || '发布失败，请稍后重试。');
        form.elements.content.value = '';
        status.textContent = visibility === 'private' ? '私密评论已送达，仅 Day 可见。' : '评论已公开发布。';
        if (visibility === 'public') {
          try { await loadComments(); } catch (_) { status.textContent += ' 列表暂时加载失败，可稍后刷新。'; }
        }
      } catch (error) { status.textContent = error.name === 'AbortError' || error.message === 'Failed to fetch' ? '连接失败，请稍后重试；输入内容已保留。' : error.message; }
      finally { button.disabled = false; }
    });
  }());
</script>
