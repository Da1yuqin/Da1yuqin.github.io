{% assign image = site.data.site_images[include.src] %}
{% assign image_src = image.src | default: include.src %}
{% if include.zoom %}<a href="{{ include.src | relative_url }}" class="image-popup" aria-label="查看原图：{{ include.alt | escape }}">{% endif %}
<img {% if include.defer and include.observe %}src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20{{ image.width }}%20{{ image.height }}'%3E%3C/svg%3E" {% endif %}{% if include.defer %}data-src{% else %}src{% endif %}="{{ image_src | relative_url }}"{% if image.srcset %} {% if include.defer %}data-srcset{% else %}srcset{% endif %}="{{ image.srcset }}" sizes="{{ include.sizes | default: '(max-width: 820px) 94vw, 800px' }}"{% endif %}{% if image.width %} width="{{ image.width }}" height="{{ image.height }}"{% endif %}{% if include.observe %} data-observe-image{% endif %}{% if include.class %} class="{{ include.class }}"{% endif %}{% if image.width or include.style %} style="{% if image.width %}aspect-ratio:{{ image.width }} / {{ image.height }};{% endif %}{{ include.style }}"{% endif %}{% if include.priority %} fetchpriority="{{ include.priority }}"{% endif %} alt="{{ include.alt | escape }}" loading="{{ include.loading | default: 'lazy' }}" decoding="async" />
{% if include.defer %}<noscript><img src="{{ image_src | relative_url }}" alt="{{ include.alt | escape }}"{% if image.width %} width="{{ image.width }}" height="{{ image.height }}"{% endif %}{% if image.width or include.style %} style="{% if image.width %}aspect-ratio:{{ image.width }} / {{ image.height }};{% endif %}{{ include.style }}"{% endif %} loading="lazy" decoding="async" /></noscript>{% endif %}
{% if include.zoom %}</a>{% endif %}
